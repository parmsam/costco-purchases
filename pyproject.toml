[project]
name = "costco-purchases"
version = "0.1.0"
description = "Local FastHTML dashboard for analyzing archived Costco in-warehouse purchase history."
requires-python = ">=3.11"
dependencies = [
    "python-fasthtml>=0.12.0",
    "monsterui>=0.0.30",
    "fh-plotly>=0.0.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "fastlite>=0.0.9",
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
